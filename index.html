function role(){return state.profile?.role||''}
function canRead(k){return configs[k].read.includes(role())}
function canWrite(k){return configs[k].write.includes(role())}
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),4500)}
function safeError(error){return error?.message || 'Something went wrong. Please try again.'}
async function query(q){const {data,error}=await q;if(error)throw error;return data}
async function loadProfile(){const {data:{user},error}=await db.auth.getUser();if(error||!user)throw error||new Error('No session');state.user=user;state.profile=await query(db.from('profiles').select('*').eq('id',user.id).single());if(state.profile.status!=='ACTIVE')throw new Error('This account is inactive. Contact your Head Admin.')}
async function loadLookup(){if(!state.profile)return;state.sites=await query(db.from('sites').select('id,site_name,client_id').order('site_name'));state.clients=HEAD.includes(role())?await query(db.from('clients').select('id,client_name').order('client_name')):[]}
function showLogin(message=''){$('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginMessage').textContent=message}
async function showApp(){await loadProfile();await loadLookup();$('login').classList.add('hidden');$('app').classList.remove('hidden');$('identity').textContent=`${state.profile.full_name||state.user.email} · ${role().replaceAll('_',' ')}`;renderNav();await openPage('dashboard')}
function renderNav(){const items=[['dashboard','Dashboard'],['sites','Sites'],['clients','Clients'],['employees','Employees'],['documents','Documents'],['site_reports','Site Reports'],['help_reports','Help & Support'],['profiles','User Access'],['audit_logs','Audit Log']];$('nav').innerHTML=items.filter(([k])=>k==='dashboard'||canRead(k)).map(([k,label])=>`<button type="button" data-page="${k}" class="${state.page===k?'active':''}">${esc(label)}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>openPage(b.dataset.page))}
async function openPage(page){state.page=page;if(page==='employees')state.employeeSiteId=null;renderNav();$('pageTitle').textContent=page==='dashboard'?'Dashboard':configs[page]?.title||page;$('content').innerHTML='<div class="panel muted">Loading…</div>';try{if(page==='dashboard')await renderDashboard();else if(page==='employees'&&canRead(page))await renderEmployeeSites();else if(canRead(page))await renderTable(page);else throw new Error('Access denied')}catch(e){$('content').innerHTML=`<div class="panel message">${esc(safeError(e))}</div>`}}
async function renderEmployeeSites(){if(!EMPLOYEE_ALL_SITES.includes(role())){const assigned=state.profile.site_id;if(!assigned)throw new Error('No site is assigned to your account. Contact your Head Admin.');state.employeeSiteId=assigned;return renderTable('employees')}
const sites=state.sites;$('content').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Employees by site</h2><span class="muted">Choose a site to view its employees.</span></div></div><div class="site-grid">${sites.map(s=>`<button type="button" class="site-card" data-site="${esc(s.id)}"><b>${esc(s.site_name)}</b><span>View employees →</span></button>`).join('')}</div>${sites.length?'':'<p class="empty">No sites available.</p>'}</section>`;$('content').querySelectorAll('[data-site]').forEach(b=>b.onclick=async()=>{state.employeeSiteId=b.dataset.site;await renderTable('employees')})}
async function renderDashboard(){
const counts=await Promise.all(['employees','sites','site_reports','help_reports'].map(async(t)=>{let q=db.from(t).select('*',{count:'exact',head:true});if(t==='site_reports'||t==='help_reports')q=q.eq('status','OPEN');const {count,error}=await q;if(error)throw error;return count??0}));$('content').innerHTML=`<div class="panel"><div class="panel-head"><div><h2>Welcome, ${esc(state.profile.full_name||state.user.email)}</h2><span class="muted">Your workforce overview</span></div><button class="btn soft small" id="refresh">Refresh</button></div><div class="stats">${[['Employees',counts[0]],['Sites',counts[1]],['Open reports',counts[2]],['Open help requests',counts[3]]].map(([l,n])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('')}</div></div><div class="panel"><h2>Quick access</h2><p class="muted">Select a module from the sidebar to manage records allowed by your role and site.</p></div>`;$('refresh').onclick=()=>openPage('dashboard')}
function displayValue(key,value,table=''){if((value==null||value==='')&&key==='site_id'&&table==='profiles')return 'Head Office';if(value==null||value==='')return '—';if(key==='site_id')return state.sites.find(s=>s.id===value)?.site_name||String(value).slice(0,8);if(key==='client_id')return state.clients.find(c=>c.id===value)?.client_name||String(value).slice(0,8);if(key==='employee_id')return state.employeeNames?.[value]||String(value).slice(0,8);if(key==='created_at')return new Date(value).toLocaleString();if(key==='status')return `<span class="badge ${value==='INACTIVE'?'inactive':''}">${esc(value)}</span>`;return esc(value)}
async function renderTable(key){const cfg=configs[key];if(key==='documents'){const people=await query(db.from('employees').select('id,employee_code,first_name,last_name').order('last_name').limit(1000));state.employeeNames=Object.fromEntries(people.map(p=>[p.id,`${p.employee_code} · ${p.first_name} ${p.last_name}`]));}
const order=key==='audit_logs'?'created_at':key==='profiles'?'full_name':key==='employees'?'last_name':key==='sites'?'site_name':key==='clients'?'client_name':key==='documents'?'uploaded_at':'created_at';if(key==='employees'&&!state.employeeSiteId)throw new Error('Choose a site first.');let request=db.from(cfg.table).select('*');if(key==='employees')request=request.eq('site_id',state.employeeSiteId);const rows=await query(request.order(order,{ascending:key!=='audit_logs'}).limit(1000));state.rows=rows;let tools=`<input type="search" id="search" placeholder="Search ${esc(cfg.title.toLowerCase())}" aria-label="Search records">`;
if(canWrite(key)&&key!=='profiles')tools+=`<button class="btn small" id="add">+ Add ${esc(key==='employees'?'employee':key==='documents'?'document':key==='site_reports'?'report':key==='help_reports'?'request':key==='sites'?'site':'client')}</button>`;
if(key==='employees'&&canWrite(key))tools+='<label class="btn soft small" style="cursor:pointer">Import CSV<input id="csv" type="file" accept=".csv,text/csv" class="hidden"></label>';

const redraw=()=>{const term=$('search').value.toLowerCase();const filtered=rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(term)));$('tableRows').innerHTML=filtered.length?filtered.map((r,i)=>`<tr>${cfg.columns.map(([k])=>`<td>${displayValue(k,r[k],key)}</td>`).join('')}<td>${canWrite(key)&&key!=='audit_logs'?`<button class="btn soft small" data-id="${esc(r.id)}">Edit</button>`:''}${key==='documents'&&r.storage_path?` <button class="btn pink small" data-file="${esc(r.storage_path)}">Open file</button>`:''}</td></tr>`).join(''):`<tr><td colspan="${cfg.columns.length+1}" class="empty">No records found.</td></tr>`;

async function openDocument(path){try{const {data,error}=await db.storage.from('besi-documents').createSignedUrl(path,60);if(error)throw error;window.open(data.signedUrl,'_blank','noopener,noreferrer')}catch(e){toast(safeError(e))}}
function inputFor(f,value){const id=`field-${f.key}`;const isProfileSite=state.editing?.key==='profiles'&&f.key==='site_id';const selected=value??(f.type==='select'?(f.options.includes('ACTIVE')?'ACTIVE':f.options.includes('OPEN')?'OPEN':f.options.includes('NORMAL')?'NORMAL':''):(f.key==='required_headcount'?0:''));let control;const options=f.type==='site'?state.sites.map(x=>[x.id,x.site_name]):f.type==='client'?state.clients.map(x=>[x.id,x.client_name]):f.type==='employee'?Object.entries(state.employeeNames||{}):f.type==='select'?(f.options||[]).map(x=>[x,x]):[];if(f.key==='department'&&value&&!options.some(([v])=>v===value))options.push([value,value]);if(options.length||['site','client','employee','select'].includes(f.type)){control=`<select id="${id}" name="${f.key}" ${f.required?'required':''}><option value="">${isProfileSite?'Head Office':'Select…'}</option>${options.map(([v,l])=>`<option value="${esc(v)}" ${String(selected)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`}else if(f.type==='textarea'){control=`<textarea id="${id}" name="${f.key}" ${f.required?'required':''}>${esc(selected)}</textarea>`}else{control=`<input id="${id}" name="${f.key}" type="${f.type}" value="${esc(selected)}" ${f.required?'required':''} ${f.type==='number'?'min="0"':''}>`}return `<label class="field ${f.type==='textarea'?'wide':''}" for="${id}">${esc(f.label)}${control}</label>`}
function openForm(key,row=null){const cfg=configs[key];if(!canWrite(key))return;state.editing={key,row};let fields=cfg.fields;if(key==='site_reports'||key==='help_reports'){if(!HEAD.includes(role()))fields=fields.filter(f=>!['status','management_response'].includes(f.key));if(row&&!HEAD.includes(role())){toast('Only management can edit submitted reports.');return}}
if(key==='documents'&&!row)fields=fields.filter(f=>f.key!=='file_name');$('dialogTitle').textContent=`${row?'Edit':'Add'} ${cfg.title.replace(/s$/,'')}`;$('fields').innerHTML=fields.map(f=>inputFor(f,row?.[f.key])).join('')+(key==='documents'&&!row?'<label class="field wide">Choose file<input name="file" type="file" required></label>':'');if(key==='employees'&&!row&&state.employeeSiteId){$('fields').querySelector('[name="site_id"]').value=state.employeeSiteId}if(role()==='COORDINATOR'){$('fields').querySelectorAll('[name="site_id"]').forEach(el=>{el.value=state.profile.site_id;el.disabled=true})}$('dialog').showModal()}
function payloadFromForm(){const {key,row}=state.editing;const data={};const fields=configs[key].fields.filter(f=>$('entryForm').elements.namedItem(f.key));for(const f of fields){const el=$('entryForm').elements.namedItem(f.key);if(el.disabled)continue;let val=el.value.trim();data[f.key]=val===''?null:f.type==='number'?Number(val):val}if(role()==='COORDINATOR'&&['employees','documents','site_reports','help_reports'].includes(key))data.site_id=state.profile.site_id;if(key==='site_reports'||key==='help_reports'){if(!row)data.reported_by=state.user.id;if(!HEAD.includes(role())){delete data.status;delete data.management_response}}if(key==='documents'&&!row)data.uploaded_by=state.user.id;if(['employees','site_reports','help_reports'].includes(key))data.updated_at=new Date().toISOString();return data}
async function saveForm(e){e.preventDefault();const {key,row}=state.editing;const btn=$('save');btn.disabled=true;try{const data=payloadFromForm();if(key==='documents'&&!row){const file=$('entryForm').elements.namedItem('file').files[0];if(!file)throw new Error('Select a file.');if(file.size>10*1024*1024)throw new Error('File limit is 10 MB.');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${data.site_id}/${data.employee_id}/${crypto.randomUUID()}-${safe}`;await query(db.storage.from('besi-documents').upload(path,file,{upsert:false}));data.storage_path=path;data.file_name=file.name;try{await query(db.from('documents').insert(data))}catch(err){await db.storage.from('besi-documents').remove([path]);throw err}}else if(row){await query(db.from(key).update(data).eq('id',row.id))}else{await query(db.from(key).insert(data))}$('dialog').close();toast('Saved successfully.');if(key==='sites'||key==='clients')await loadLookup();if(key==='employees')await renderTable('employees');else await openPage(key)}catch(err){toast(safeError(err))}finally{btn.disabled=false}}
function parseCSV(text){const out=[];let cell='',row=[],quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))out.push(row);return out}
async function importCSV(e){const file=e.target.files?.[0];if(!file)return;try{const parsed=parseCSV(await file.text());const headers=parsed.shift().map(x=>x.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_'));const allowed=configs.employees.fields.map(f=>f.key);for(const required of ['employee_code','last_name','first_name','site_id'])if(!headers.includes(required))throw new Error(`CSV requires ${required} column.`);const rows=parsed.map((r,i)=>{const x={};headers.forEach((h,j)=>{if(allowed.includes(h)&&r[j]?.trim())x[h]=r[j].trim()});if(role()==='COORDINATOR')x.site_id=state.profile.site_id;if(!x.employee_code||!x.last_name||!x.first_name||!x.site_id)throw new Error(`Missing required field on CSV row ${i+2}`);if(x.site_id!==state.employeeSiteId)throw new Error(`CSV row ${i+2} belongs to a different site. Select its site first.`);return x});if(!rows.length)throw new Error('CSV has no employee rows.');if(rows.length>1000)throw new Error('Import up to 1,000 employees at a time.');if(!confirm(`Import ${rows.length} employees? Use site UUIDs from the Sites table in the site_id column.`))return;let saved=0;for(let i=0;i<rows.length;i+=100){await query(db.from('employees').insert(rows.slice(i,i+100)));saved+=Math.min(100,rows.length-i)}toast(`Imported ${saved} employees.`);await renderTable('employees')}catch(err){toast(safeError(err))}finally{e.target.value=''}}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginButton').disabled=true;$('loginMessage').textContent='';try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await showApp()}catch(err){$('loginMessage').textContent=safeError(err);if(state.user&&state.profile?.status!=='ACTIVE')await db.auth.signOut()}finally{$('loginButton').disabled=false}};
$('logout').onclick=async()=>{await db.auth.signOut();state.user=null;state.profile=null;showLogin()};$('cancel').onclick=()=>$('dialog').close();$('entryForm').onsubmit=saveForm;
(async()=>{try{const {data:{session}}=await db.auth.getSession();if(session)await showApp();else showLogin()}catch(err){await db.auth.signOut();showLogin(safeError(err))}})();
</script>
